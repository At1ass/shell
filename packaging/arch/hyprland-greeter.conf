monitor = DP-3,1920x1080@164.92,0x0,1,transform,3
monitor = DP-2,3440x1440@144,1080x0,1

# The greeter is installed by at1ass-shell-greeter into /usr/share, root-owned:
# the login screen no longer runs code out of the user's home, and the greeter
# user needs no access to it.
# qs dies as a whole if a single C++ QML plugin fails to load (broken SONAME,
# typo in QML). Without "|| regreet" that closed Hyprland, greetd went into a
# restart loop until start-limit-hit, and the only way in was a tty.
exec-once = qs -p /usr/share/at1ass-shell/greeter || regreet; hyprctl dispatch exit

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_hyprland_guiutils_check = true
}
